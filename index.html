*{

html{

}

body{

  overflow-x:clip
}

button,a{
  font-family:inherit
}

button{
  cursor:pointer
}

.font-display{
  font-family:'Archivo Black','Archivo',system-ui,sans-serif;
  letter-spacing:-.04em
}

.gold-text{
  background:linear-gradient(180deg,#FFF8B0 0%,#FFD700 42%,#E2A500 72%,#FFF0A0 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent
}

.gold-btn{
  background:linear-gradient(180deg,#FFF28A,#FFD700 55%,#E5A600);
  color:#090800;
  box-shadow:0 10px 0 #7E5A00,0 18px 38px rgba(255,215,0,.24)
}

.gold-btn:active{
  transform:translateY(4px);
  box-shadow:0 5px 0 #7E5A00
}

.outline-btn{
  border:2px solid var(--gold);
  color:var(--gold);
  background:rgba(255,215,0,.06)
}

.outline-btn:active{
  transform:scale(.98)
}

.card{
  background:linear-gradient(145deg,#151102,#0a0800);
  border:1px solid #352B04;
  border-radius:24px
}

.marquee{
  display:flex;
  gap:0;
  white-space:nowrap;
  animation:marquee 18s linear infinite;
  width:-moz-max-content;
  width:max-content
}

@keyframes marquee{
  to{
    transform:translateX(-50%)
  }
}

@keyframes pop{
  0%{
    transform:scale(.7);
    opacity:0
  }

  70%{
    transform:scale(1.08)
  }

  100%{
    transform:scale(1);
    opacity:1
  }
}

@keyframes boom{
  0%{
    transform:scale(.55) rotate(-5deg);
    opacity:0
  }

  55%{
    transform:scale(1.18) rotate(2deg);
    opacity:1
  }

  100%{
    transform:scale(1) rotate(0)
  }
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-8px)
  }
}

@keyframes pulse-ring{
  0%{
    box-shadow:0 0 0 0 rgba(255,215,0,.55)
  }

  100%{
    box-shadow:0 0 0 28px rgba(255,215,0,0)
  }
}

@keyframes confetti-fall{
  0%{
    transform:translateY(-20px) rotate(0);
    opacity:1
  }

  100%{
    transform:translateY(720px) rotate(720deg);
    opacity:.1
  }
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-5px)
  }

  75%{
    transform:translateX(5px)
  }
}

@keyframes ticker{
  0%{
    transform:translateY(0)
  }

  100%{
    transform:translateY(-50%)
  }
}

.pop{
  animation:pop .35s ease both
}

.boom{
  animation:boom .55s cubic-bezier(.2,1.5,.3,1) both
}

.floaty{
  animation:floaty 2.6s ease-in-out infinite
}

.pulse-ring{
  animation:pulse-ring 1.1s ease-out infinite
}

.shake{
  animation:shake .25s ease
}

.confetti{
  position:absolute;
  top:-10px;
  width:9px;
  height:16px;
  border-radius:2px;
  animation:confetti-fall linear forwards;
  pointer-events:none
